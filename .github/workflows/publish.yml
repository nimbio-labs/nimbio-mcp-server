name: Publish to npm

# Publishes on a pushed version tag (e.g. v0.1.0) using npm Trusted Publishing
# (OIDC) — no npm token stored in the repo, and npm provenance is attached
# automatically.
#
# One-time setup (after the first release exists on npm):
#   1. npm requires a package to EXIST before a trusted publisher can be added
#      to it, so the first publish must be manual:
#        npm login && npm publish        (publishConfig.access makes it public)
#   2. On npmjs.com > @nimbio/mcp-server > Settings > Trusted Publisher, add
#      GitHub Actions with:
#        repository: nimbio-labs/nimbio-mcp-server
#        workflow:   publish.yml
#        environment: (leave blank, or set "npm" and add it below)
#   3. Ensure the @nimbio scope/org exists on npm and you can publish to it.
# After that, tag `vX.Y.Z` and push the tag — this workflow does the rest.

on:
  push:
    tags: ["v*"]

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # required for OIDC trusted publishing + provenance
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          registry-url: "https://registry.npmjs.org"

      - name: Upgrade npm (trusted publishing needs npm >= 11.5.1)
        run: npm install -g npm@latest

      - name: Verify the pushed tag matches package.json version
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          PKG="$(node -p "require('./package.json').version")"
          echo "tag=$GITHUB_REF_NAME (=> $TAG), package.json=$PKG"
          if [ "$TAG" != "$PKG" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match package.json version $PKG" >&2
            exit 1
          fi

      - name: Install
        run: npm ci

      - name: Verify (lint + types + coverage)
        run: npm run check

      - name: Build
        run: npm run build

      # --provenance here rather than publishConfig.provenance, so a manual
      # first publish (which has no CI OIDC to attest with) still works.
      - name: Publish
        run: npm publish --provenance
