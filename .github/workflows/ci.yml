name: CI

on:
  push:
    branches: [main, development]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: ["18", "20", "22"]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - name: Install
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Type check
        run: npm run typecheck

      - name: Test + coverage
        run: npm run coverage

      - name: Build
        run: npm run build

      # The build must be runnable, not merely produced: a server that cannot
      # start is not caught by any unit test. It is expected to exit non-zero
      # here (no API key), but it must fail with its own diagnostic rather than
      # a module-resolution or syntax error.
      - name: Smoke the built entrypoint
        run: |
          set +e
          OUT="$(node dist/index.js 2>&1)"
          RC=$?
          echo "$OUT"
          if [ "$RC" -eq 0 ]; then
            echo "::error::server exited 0 with no API key; it should refuse to start" >&2
            exit 1
          fi
          case "$OUT" in
            *NIMBIO_API_KEY*) echo "refused to start with the expected message" ;;
            *) echo "::error::unexpected startup failure: $OUT" >&2; exit 1 ;;
          esac
