name: CI

on:
  push:
    branches: [main, development]
  pull_request:

jobs:
  # Full verification. Node 20+ only, because vitest 4 requires it — see the
  # `compat` job below for why that does not narrow what the package supports.
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: ["20", "22"]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - name: Install
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Type check
        run: npm run typecheck

      - name: Test + coverage
        run: npm run coverage

      - name: Build
        run: npm run build

      - name: Smoke the built entrypoint
        run: bash .github/smoke-entrypoint.sh

  # The package declares `engines: node >= 18`, and its runtime dependencies
  # (@modelcontextprotocol/sdk, @nimbio/community-api) both support 18. The test
  # runner does not: vitest 4 needs Node 20+. So 18 is verified the way it
  # actually matters — the shipped artifact builds and boots — rather than
  # dropped from support because a devDependency moved on.
  compat:
    name: node-18 (build + boot only)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node 18
        uses: actions/setup-node@v4
        with:
          node-version: "18"
          cache: npm

      - name: Install
        run: npm ci

      - name: Build
        run: npm run build

      - name: Smoke the built entrypoint
        run: bash .github/smoke-entrypoint.sh
