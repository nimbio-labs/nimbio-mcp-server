name: CI

on:
  push:
    branches: [main, development]
  pull_request:

jobs:
  # Full verification. Node 22.12+ only, because vitest 5 requires it — see the
  # `compat` job below for why that does not narrow what the package supports.
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: ["22", "24"]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      # npm 10 crashes resolving vite 8's optional devtools peer chain when a
      # dependency is added; use the npm the lockfile was made with.
      - name: Upgrade npm
        run: npm install -g npm@11.19.1

      - name: Install
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Type check
        run: npm run typecheck

      - name: Test + coverage
        run: npm run coverage

      - name: Build
        run: npm run build

      - name: Smoke the built entrypoint
        run: bash .github/smoke-entrypoint.sh

  # The package declares `engines: node >= 18`, and its runtime dependencies
  # (@modelcontextprotocol/sdk, @nimbio/community-api) both support 18. The test
  # runner does not: vitest 5 needs Node 22.12+. So 18 and 20 are verified the
  # way it actually matters — the shipped artifact builds and boots — rather
  # than dropped from support because a devDependency moved on. These legs keep
  # the bundled npm: npm 11 does not run on Node 18, and `npm ci` from the
  # lockfile never hits the npm 10 resolver crash.
  compat:
    name: node-${{ matrix.node-version }} (build + boot only)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: ["18", "20"]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - name: Install
        run: npm ci

      - name: Build
        run: npm run build

      - name: Smoke the built entrypoint
        run: bash .github/smoke-entrypoint.sh
